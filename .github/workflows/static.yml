name: Create Github Release

on:
  push:
    branches: ["main"]

  workflow_dispatch:

concurrency:
  group: "main"
  cancel-in-progress: true

jobs:
  build_linux_x86_64:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6

      # Rust
      - run: curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y && echo "$HOME/.cargo/bin" >> $GITHUB_PATH
      - run: which cargo && cargo --version

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      # Nodejs
      - run: mkdir -p $HOME/.local/nodejs && VERSION=$(curl -sL https://nodejs.org/dist/index.tab | awk 'NR > 1 && $10 != "-" {print $1; exit}') && curl -L https://nodejs.org/download/release/$VERSION/node-$VERSION-linux-x64.tar.gz | tar --strip-components=1 -xzf - -C $HOME/.local/nodejs && echo "$HOME/.local/nodejs/bin" >> $GITHUB_PATH
      - run: which node && node --version

      # Deps
      - run: npm install
      - run: cargo fetch

      # Build
      - run: node ./.scripts/build.mts
      - run: cargo build --release -p onlytrades
      - run: mkdir -p artifacts && cd target/release && tar -czf ../../artifacts/onlytrades_linux_x86_64.tar.gz onlytrades 
      
      # Copy client routes manifest
      - run: cp ./dist/client_manifest.json ./artifacts

      - uses: actions/upload-artifact@v7
        with:
          name: onlytrades_linux_x86_64
          path: ${{ github.workspace }}/artifacts/**/*
          if-no-files-found: error
          retention-days: 1

  build_linux_arm64:
    runs-on: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v6

      # Rust
      - run: curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y && echo "$HOME/.cargo/bin" >> $GITHUB_PATH
      - run: which cargo && cargo --version

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      # Nodejs
      - run: mkdir -p $HOME/.local/nodejs && VERSION=$(curl -sL https://nodejs.org/dist/index.tab | awk 'NR > 1 && $10 != "-" {print $1; exit}') && curl -L https://nodejs.org/download/release/$VERSION/node-$VERSION-linux-arm64.tar.gz | tar --strip-components=1 -xzf - -C $HOME/.local/nodejs && echo "$HOME/.local/nodejs/bin" >> $GITHUB_PATH
      - run: which node && node --version

      # Deps
      - run: npm install
      - run: cargo fetch

      # Build
      - run: node ./.scripts/build.mts
      - run: cargo build --release -p onlytrades
      - run: mkdir -p artifacts && cd target/release && tar -czf ../../artifacts/onlytrades_linux_arm64.tar.gz onlytrades 

      - uses: actions/upload-artifact@v7
        with:
          name: onlytrades_linux_arm64
          path: ${{ github.workspace }}/artifacts/**/*
          if-no-files-found: error
          retention-days: 1

  github_release:
    runs-on: ubuntu-22.04
    needs:
      - build_linux_x86_64
      - build_linux_arm64
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with: 
          path: artifacts 
          merge-multiple: true
      - run: |
          set -e

          LAST_TAG=$(curl -sSL https://api.github.com/repos/alshdavid/onlytrades.live/releases/latest | jq -r ".tag_name" | cut -d "." -f 3)
          if [ "$LAST_TAG" = "null" ]; then
            LAST_TAG="0"
          fi
          declare -i var="$LAST_TAG"
          var=$var+1
          TAG="0.0.$var"

          echo "Tag: ${TAG}"

          gh release create $TAG  --draft --notes "Automatically built binaries"
          gh release edit $TAG --title "🚀 Latest"

          cd artifacts

          for name in *; do
            gh release upload $TAG ${name}
          done

          gh release edit $TAG --draft=false

          echo "VERSION=$TAG" >> "$GITHUB_OUTPUT"